<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Atelier">
  <!--
    ATELIER

    An "A" built from two strokes that meet at the top: teal on the left, amber
    on the right. Those are the product's two actors — a human and the agent —
    and the whole thesis is that they converge on one piece of work rather than
    replacing each other.

    The crossbar is where they meet, and it is neither colour: it is the work.

    Round caps and a slight asymmetry are deliberate. An atelier is a workshop
    where things are made by hand, and a perfectly geometric mark would read as
    a machine services company, which is precisely the thing this is not.
  -->
  <defs>
    <!-- userSpaceOnUse is required, not stylistic: the crossbar is a horizontal
         line, so its object bounding box has zero height, and a gradient in
         objectBoundingBox units on a zero-height box is not rendered at all.
         With the default units the crossbar silently disappears and the mark
         reads as a caret rather than an A. -->
    <linearGradient id="atelier-bar" gradientUnits="userSpaceOnUse" x1="21" y1="38" x2="43" y2="38">
      <stop offset="0%" stop-color="#45C8D6"/>
      <stop offset="100%" stop-color="#F2C15C"/>
    </linearGradient>
  </defs>

  <!-- Left leg — the human -->
  <path d="M32 11 L14 52"
        fill="none" stroke="#45C8D6" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Right leg — the agent -->
  <path d="M32 11 L50 52"
        fill="none" stroke="#F2C15C" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- The crossbar: the work they meet over -->
  <path d="M21 38 L43 38"
        fill="none" stroke="url(#atelier-bar)" stroke-width="6"
        stroke-linecap="round"/>
</svg>

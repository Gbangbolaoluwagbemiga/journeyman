[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# remappings.txt is explicit rather than inferred. v4-core vendors its own copy
# of OpenZeppelin, and forge's auto-remapping began resolving @openzeppelin/
# into that nested copy -- which has no upgradeable contracts, so the whole
# project stopped compiling the moment v4-core was installed.
via_ir = true
optimizer = true
# Tuned for SIZE, not gas. Adding productive escrow pushed the runtime past
# EIP-170's 24,576-byte limit by ~2.2KB, and a contract that cannot be deployed
# costs infinitely more gas than one that is slightly more expensive to call.
# Raise this again only if the runtime margin allows it — `forge build --sizes`.
optimizer_runs = 1
# OpenZeppelin 5.1's ERC1967Utils requires ^0.8.21, so 0.8.20 can no longer
# build the UUPS proxy path.
solc_version = "0.8.28"

# Cancun, which is the whole reason this project moved.
#
# This was pinned to "shanghai" on the previous chain, which is not guaranteed
# to have MCOPY or TSTORE — and Uniswap v4's PoolManager takes its lock with
# TSTORE, so the yield adapter could be fork-tested there and never deployed.
# Arbitrum supports cancun and has a live PoolManager on both One and Sepolia,
# so the adapter runs against a real pool. It is deployed against one.
evm_version = "cancun"

[rpc_endpoints]
# Literal, not ${VAR}. Foundry does not expand shell-style defaults here, so a
# "${VAR:-fallback}" is read as one long variable name and fails with the
# fallback quoted back at you. A private endpoint is passed explicitly instead:
#   forge script ... --rpc-url https://your-endpoint
arbitrum_sepolia = "https://sepolia-rollup.arbitrum.io/rpc"
arbitrum_one = "https://arb1.arbitrum.io/rpc"
# Kept: the adapter's fork tests still point at Base, which has had a v4
# PoolManager the longest. Read-only, so it needs no key.
base = "https://mainnet.base.org"

# Etherscan's V2 API is multichain: one key covers Arbiscan, so ETHERSCAN_API_KEY
# is reused rather than issuing a second one. It is also why `--verify` works
# inline on a deploy here, which is not something to take for granted — the
# previous chain's explorer was a self-hosted Blockscout whose legacy /api
# rate-limited, and verifying meant posting standard-JSON to its v2 endpoint by
# hand, one contract at a time.
[etherscan]
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
arbitrum_one = { key = "${ETHERSCAN_API_KEY}", chain = 42161 }

# Fork tests against a real Uniswap v4 PoolManager need no separate profile any
# more. They did when the default was shanghai: PoolManager's lock uses transient
# storage, so its bytecode halted with EvmError: NotActivated the moment unlock()
# was called, and loosening the default would have loosened what gets deployed.
# The default is cancun now because the deployment target is, so:
#
#   forge test --match-path test/UniswapV4Fork.t.sol \
#     --fork-url https://sepolia-rollup.arbitrum.io/rpc

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# remappings.txt is explicit rather than inferred. v4-core vendors its own copy
# of OpenZeppelin, and forge's auto-remapping began resolving @openzeppelin/
# into that nested copy -- which has no upgradeable contracts, so the whole
# project stopped compiling the moment v4-core was installed.
via_ir = true
optimizer = true
# Tuned for SIZE, not gas. Adding productive escrow pushed the runtime past
# EIP-170's 24,576-byte limit by ~2.2KB, and a contract that cannot be deployed
# costs infinitely more gas than one that is slightly more expensive to call.
# Raise this again only if the runtime margin allows it — `forge build --sizes`.
optimizer_runs = 1
# OpenZeppelin 5.1's ERC1967Utils requires ^0.8.21, so 0.8.20 can no longer
# build the UUPS proxy path.
solc_version = "0.8.28"

# Cancun, which is the whole reason this project moved.
#
# This was pinned to "shanghai" on Arc, because Arc EVM is not guaranteed to
# have MCOPY or TSTORE — and Uniswap v4's PoolManager takes its lock with
# TSTORE, so the yield adapter could be fork-tested there and never deployed.
# Arbitrum supports cancun and has a live PoolManager on both One and Sepolia,
# so the adapter can finally run against a real pool rather than a fork.
evm_version = "cancun"

[rpc_endpoints]
arbitrum_sepolia = "${ARB_SEPOLIA_RPC_URL:-https://sepolia-rollup.arbitrum.io/rpc}"
arbitrum_one = "${ARB_RPC_URL:-https://arb1.arbitrum.io/rpc}"
# Kept: the adapter's fork tests still point at Base, which has had a v4
# PoolManager the longest. Read-only, so it needs no key.
base = "${BASE_RPC_URL:-https://mainnet.base.org}"

[etherscan]
arbitrum_sepolia = { key = "${ARBISCAN_API_KEY}", chain = 421614 }
arbitrum_one = { key = "${ARBISCAN_API_KEY}", chain = 42161 }

# Fork tests against a real Uniswap v4 PoolManager.
#
# The default profile is pinned to shanghai for Arc, and PoolManager's lock uses
# transient storage -- so under the default profile its bytecode halts with
# EvmError: NotActivated the moment unlock() is called. That is a property of
# the chain the test forks (Base, which has cancun), not of Journeyman's own
# deployment target, so it belongs in its own profile rather than loosening the
# one that governs what gets deployed to Arc.
#
#   FOUNDRY_PROFILE=fork forge test --match-path test/UniswapV4Fork.t.sol \
#     --fork-url https://mainnet.base.org
[profile.fork]
src = "src"
out = "out-fork"
libs = ["lib"]
via_ir = true
optimizer = true
optimizer_runs = 1
solc_version = "0.8.28"
evm_version = "cancun"
